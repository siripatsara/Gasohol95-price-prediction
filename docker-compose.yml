version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: perfect_postgres
    environment:
      POSTGRES_DB: gasohol_prediction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql
    networks:
      - perfect_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d gasohol_prediction" ]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: perfect_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gasohol.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - perfect_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: perfect_redis
    ports:
      - "6380:6379"
    networks:
      - perfect_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:


networks:
  perfect_network:
    driver: bridge
